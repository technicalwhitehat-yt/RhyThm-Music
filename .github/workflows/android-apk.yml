name: Build Android apk 
on: workflow_dispatch
  
jobs:

  build-android-apk:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.2'
      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
          
      - name: Clone project
        run: git clone https://github.com/technicalwhitehat-yt/RhyThm-Music

      - name: Flutter doctor
        run: flutter doctor
        
      - name: Install project dependencies
        working-directory: ./RhyThm-Music
        run: flutter pub get

      - name: Update lang data
        working-directory: ./RhyThm-Music
        run: dart localization/generator.dart

      - name: Set update check flag to true
        working-directory: ./RhyThm-Music/lib/utils
        run: echo "const updateCheckFlag = true;" > update_check_flag_file.dart
        
      - name: Configure Keystore from Secrets
        working-directory: ./RhyThm-Music
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if ($env:KEYSTORE_BASE64) {
              [IO.File]::WriteAllBytes("android/app/rhythm_release.keystore", [Convert]::FromBase64String($env:KEYSTORE_BASE64))
              Set-Content -Path "android/key.properties" -Value "storePassword=$env:KEYSTORE_PASSWORD", "keyPassword=$env:KEY_PASSWORD", "keyAlias=$env:KEY_ALIAS", "storeFile=rhythm_release.keystore"
              Write-Host "Keystore configured successfully."
          } else {
              Write-Host "No KEYSTORE_BASE64 found, skipping keystore setup."
          }

      - name: Build android apk
        working-directory: ./RhyThm-Music
        run: |
          flutter build apk --split-per-abi --release
          flutter build apk

      - name: Upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: RhyThm music V2.1 apk
          path: ./RhyThm-Music/build/app/outputs/flutter-apk/*apk
