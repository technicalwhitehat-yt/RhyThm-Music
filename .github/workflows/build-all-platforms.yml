name: Build all app at once 
on: workflow_dispatch
  
jobs:
  build-linux-deb:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.2'
          
      - name: Clone project
        run: git clone https://github.com/technicalwhitehat-yt/RhyThm-Music.git

      - name: Flutter doctor
        run: flutter doctor
        
      - name: Install project dependencies
        working-directory: ./RhyThm-Music
        run: flutter pub get

      - name: Update lang data
        working-directory: ./RhyThm-Music
        run: dart localization/generator.dart

      - name: Set update check flag to true
        working-directory: ./RhyThm-Music/lib/utils
        run: echo "const updateCheckFlag = true;" > update_check_flag_file.dart
          
      - name: install required deps for linux package
        run: |
          sudo apt-get install libmpv-dev mpv libayatana-appindicator3-dev ninja-build libgtk-3-dev
          
      - name: Flutter doctor
        run: flutter doctor

      - name: Build linux deb package
        working-directory: ./RhyThm-Music
        run: |
          dart pub global activate flutter_distributor
          flutter_distributor package --platform linux --targets deb
          
      - name: Upload linux deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: RhyThm music linux deb
          path: ./RhyThm-Music/dist/*

  build-android-apk-and-windows-exe:
    runs-on: windows-2022
    
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.2'
      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
          
      - name: Clone project
        run: git clone https://github.com/technicalwhitehat-yt/RhyThm-Music.git

      - name: Flutter doctor
        run: flutter doctor
        
      - name: Install project dependencies
        working-directory: ./RhyThm-Music
        run: flutter pub get

      - name: Update lang data
        working-directory: ./RhyThm-Music
        run: dart localization/generator.dart

      - name: Set update check flag to true
        working-directory: ./RhyThm-Music/lib/utils
        run: echo "const updateCheckFlag = true;" > update_check_flag_file.dart
        
      - name: Configure Keystore from Secrets
        working-directory: ./RhyThm-Music
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if ($env:KEYSTORE_BASE64) {
              [IO.File]::WriteAllBytes("android/app/rhythm_release.keystore", [Convert]::FromBase64String($env:KEYSTORE_BASE64))
              Set-Content -Path "android/key.properties" -Value "storePassword=$env:KEYSTORE_PASSWORD", "keyPassword=$env:KEY_PASSWORD", "keyAlias=$env:KEY_ALIAS", "storeFile=rhythm_release.keystore"
              Write-Host "Keystore configured successfully."
          } else {
              Write-Host "No KEYSTORE_BASE64 found, skipping keystore setup."
          }

      - name: Build android apk
        working-directory: ./RhyThm-Music
        run: |
          flutter build apk --split-per-abi --release
          flutter build apk

      - name: Upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: RhyThm music apk
          path: ./RhyThm-Music/build/app/outputs/flutter-apk/*apk

      - name: Build windows exe package
        working-directory: ./RhyThm-Music
        run: |
          dart pub global activate flutter_distributor
          flutter_distributor package --platform windows --targets exe
          
      - name: Upload Windows exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: RhyThm music windows exe
          path: ./RhyThm-Music/dist/*

  build-ios-ipa:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.2'

      - name: Clone project
        run: git clone https://github.com/technicalwhitehat-yt/RhyThm-Music.git

      - name: Flutter doctor
        run: flutter doctor
        
      - name: Install project dependencies
        working-directory: ./RhyThm-Music
        run: flutter pub get

      - name: Update lang data
        working-directory: ./RhyThm-Music
        run: dart localization/generator.dart

      - name: Set update check flag to true
        working-directory: ./RhyThm-Music/lib/utils
        run: echo "const updateCheckFlag = true;" > update_check_flag_file.dart

      - name: Fix audiotags iOS native framework
        run: |
          PUB_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          for dir in $(find "$PUB_DIR" ./RhyThm-Music -name "audiotags.podspec" -exec dirname {} \; 2>/dev/null); do
            echo "Patching audiotags at: $dir"
            sed -i '' 's/\[ ! -d ios.zip \]d/\[ ! -d ios.zip \]/g' "$dir/audiotags.podspec" 2>/dev/null || true
            mkdir -p "$dir/Frameworks/audiotags.xcframework"
            curl -sL "https://github.com/erikas-taroza/audiotags/releases/download/v1.4.2/ios.zip" -o "$dir/Frameworks/ios.zip"
            unzip -qo "$dir/Frameworks/ios.zip" -d "$dir/Frameworks/audiotags.xcframework"
            touch "$dir/Frameworks/ios.zip"
          done
          cd ./RhyThm-Music/ios
          pod install --repo-update

      - name: release ios package
        working-directory: ./RhyThm-Music
        run: flutter build ios --release --no-codesign

      - run: mkdir Payload
        working-directory: ./RhyThm-Music/build/ios/iphoneos

      - run: mv Runner.app/ Payload
        working-directory: ./RhyThm-Music/build/ios/iphoneos

      - name: Zip output
        run: zip -qq -r -9 rhythmmusic.ipa Payload
        working-directory: ./RhyThm-Music/build/ios/iphoneos

      - name: Upload ios ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: RhyThm music ios ipa
          path: ./RhyThm-Music/build/ios/iphoneos/rhythmmusic.ipa
      

      

          
      
          

